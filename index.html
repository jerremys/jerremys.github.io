<!DOCTYPE html>
<html lang="en">

<head>
	<title>Latin & Greek Roots</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="A quiz app to learn and practice latin and greek word roots, suffixes, and prefixes" />
	<meta name="author" content="Jerremy Strassner" />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	<link type="text/css" rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	<link type="text/css" rel="stylesheet" href="css/latin.css">
	<link type="text/css" rel="stylesheet" href="css/celebrations.css">
	<meta name="google-site-verification" content="MMLQiQs2Axuz_mG5xZ_u1p0iWhvReEnHLtwdThtUquk" />

	<link rel="apple-touch-icon-precomposed" sizes="152x152" href="img/apple-touch-icon-152x152.png" />
	<link rel="icon" type="image/png" href="img/favicon-196x196.png" sizes="196x196" />

	<meta name="application-name" content="Latin & Greek Root Quiz" />
	<meta name="msapplication-TileColor" content="#FFFFFF" />
	<meta name="msapplication-TileImage" content="img/mstile-144x144.png" />
	<meta name="msapplication-square70x70logo" content="img/mstile-70x70.png" />
	<meta name="msapplication-square150x150logo" content="img/mstile-150x150.png" />
	<meta name="msapplication-wide310x150logo" content="img/mstile-310x150.png" />
	<meta name="msapplication-square310x310logo" content="img/mstile-310x310.png" />

	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>
	<div class="card-container">
		<div class="card">
			<div class="card-title">
				<h2 id="latinRoot">Loading</h2>
				<div id="loading">
					<div class="loader"></div>
				</div>
			</div>
			<div class="card-content" id="answerContainer"></div>
			<div class="card-action" id="root-actions">
				<a href="javascript:void(0);" id="nextRoot" class="btn">Next</a>
			</div>
		</div>
	</div>

	<div class="hint-container">
		<div class="card hint" id="hint_card">
			<div class="card-title">
				<h2 id="hint-card">Hint</h2>
			</div>
			<div class="card-content">
				<p><strong>Origin</strong><span id="rootOrigin"></span></p>
				<p><strong>Examples</strong><span id="rootHint"></span></p>
			</div>
		</div>
	</div>
	<a id="hint-marker" href="javascript: $('html, body').animate({ scrollTop: $(document).height() });">
		<svg xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns%23" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns%23" xmlns:svg="http://www.w3.org/2000/svg" xmlns="http://www.w3.org/2000/svg" id="Layer_1" data-name="Layer 1" viewBox="0 0 115.4 122.88" version="1.1">
			<defs id="defs9" />
			<title id="title2">down-arrow</title>
			<path d="M24.94,55A14.66,14.66,0,0,0,4.38,75.91l43.45,42.76a14.66,14.66,0,0,0,20.56,0L111,76.73A14.66,14.66,0,0,0,90.46,55.82l-18,17.69-.29-59.17c-.1-19.28-29.42-19-29.33.24l.29,58.34L24.94,55Z" id="path4" style="fill:#ffffff;fill-opacity:1" />
		</svg>
	</a>
	<div id="top-of-site-pixel-anchor"></div>
	<p id="page-end">&nbsp;</p>
	<div id="exclamation">Nice!</div>
	<div id="lets-celebrate" class="zigzag">Nice!</div>

	<div class="wrapper">
		<input type="checkbox" id="btn" hidden />
		<label for="btn" class="menu-btn">
			<i class="fas fa-bars">☰</i>
			<i class="fas fa-times">🗙</i>
		</label>
		<nav id="sidebar">
			<div class="title"><img src="img/logo.png" />
				<h1>LaŦiŋ & Grεεk Řooŧs</h1>
			</div>
			<form id="settings">
				<ul class="list-items">
					<li>
						<input type="checkbox" name="auto_submit" id="auto_submit" value="1" class="setting" checked><label for="auto_submit">Auto submit</label>
					</li>
					<li>
						<input type="checkbox" name="show_hint" id="show_hint" value="1" class="setting" checked><label for="show_hint">Show hints</label>
					</li>
					<li>
						<input type="checkbox" name="all_roots" id="all_roots" value="1" class="setting"><label for="all_roots">Only Common Roots</label>
					</li>
					<li>
						<label for="answer_choices"><span id="selected_answer_choices"></span> Answer Choices</label><input type="range" name="answer_choices" value="5" min="3" max="9" id="answer_choices" class="setting" />
					</li>
					<div class="icons">
						<a href="mailto:jerremy.strassner@gmail.com">✉ jerremy.strassner@gmail.com</a>
					</div>
				</ul>
			</form>
		</nav>
	</div>

	<div id="celebrations">
		<canvas id="celebrationCanvas"></canvas>
		<div id="stars-celebration">
			<div class="night">
				<div class="shooting_star"></div>
				<div class="shooting_star"></div>
				<div class="shooting_star"></div>
				<div class="shooting_star"></div>
				<div class="shooting_star"></div>
			</div>
		</div>
		<div id="aquarium-celebration">
			<div class="aquarium">
				<div class="aquarium__table"></div>
				<div class="aquarium__aquarium">
					<div class="aquarium__water"></div>
					<div class="aquarium__bubble"></div>
					<div class="aquarium__bubble"></div>
					<div class="aquarium__bubble"></div>
					<div class="aquarium__bubble"></div>
					<div class="aquarium__bubble"></div>
					<div class="aquarium__bubble"></div>
					<div class="aquarium__bubble"></div>
					<div class="aquarium__bubble"></div>
				</div>
				<div class="aquarium__drops">
					<div class="aquarium__drop"></div>
					<div class="aquarium__water-column"></div>
					<div class="aquarium__splash"></div>
					<div class="aquarium__splash"></div>
				</div>
				<div class="aquarium__sponge-box">
					<div class="aquarium__body">
						<div class="aquarium__body-hole"></div>
					</div>
					<div class="aquarium__face">
						<div class="aquarium__mouth"></div>
					</div>
				</div>
			</div>

		</div>

		<div id="bear-celebration">
			<div class="container">
				<div class="oval-thought">
					Looking Good!
				</div>
				<div class="bear">
					<div class="bear__ears">
						<div class="bear__ears__left ear"></div>
						<div class="bear__ears__right ear"></div>
					</div>
					<div class="bear__body">
						<div class="bear__eyes">
							<div class="bear__eyes--left eye"></div>
							<div class="bear__eyes--right eye"></div>
						</div>
						<div class="bear__nose">
							<div class="bear__nose--inner"></div>
						</div>
					</div>
				</div>
				<div class="shadow"></div>
			</div>
		</div>
	</div>

	<script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
	<script src="app/celebrations.js"></script>
	<script src="app/app.js"></script>

	<script async src="https://www.googletagmanager.com/gtag/js?id=G-30S92M0SZD"></script>
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-B9HFVPHJPB"></script>

		gtag('config', 'G-B9HFVPHJPB');

</body>

</html>
